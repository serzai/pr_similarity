name: Native Homebrew Python

'on':
  push:
    paths: ['benchmark/**', 'viewer/**', '.github/workflows/native-homebrew.yml']
  pull_request:
    paths: ['benchmark/**', 'viewer/**', '.github/workflows/native-homebrew.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-homebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Homebrew ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
        working-directory: benchmark
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTEST_ADDOPTS: '--maxfail=3 --tb=short'
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Homebrew Python 3.12
        run: |
          # Runner images already link python.org executables into /usr/local.
          # Use the Homebrew keg directly rather than replacing those links.
          brew install --skip-link python@3.12
          brew list --versions python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -c \
            'import sys; from pathlib import Path; print(sys.version, sys.base_prefix); assert Path(sys.base_prefix).resolve().is_relative_to(Path(sys.argv[1]).resolve())' \
            "$(brew --prefix python@3.12)"
          echo "PRSIM_HOMEBREW_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"
      - name: Prepare benchmark with Homebrew Python
        run: make setup PYTHON="$PRSIM_HOMEBREW_PYTHON"
      - name: Prepare viewer consumer
        working-directory: viewer
        run: make setup PYTHON="$PRSIM_HOMEBREW_PYTHON"
      - name: Native Python relocation and isolation
        run: .venv/bin/python -m pytest tests/test_macos_python.py
      - name: Native workflow and portable evidence
        run: >-
          .venv/bin/python -m pytest
          'tests/test_artifact_workflow.py::test_public_runner_native_artifact_workflow[3]'
      - name: Independent producer archive roundtrip
        working-directory: viewer
        run: >-
          .venv/bin/python -m pytest
          'tests/test_producer_roundtrip.py::test_actual_producer_archive_publishes_and_serves_all_role_pairs[3-False]'
          tests/test_python_probe_contract.py tests/test_archive.py tests/test_models.py
